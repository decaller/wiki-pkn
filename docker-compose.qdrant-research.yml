services:
  qdrant-research:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant-research
    restart: unless-stopped
    ports:
      - "${QDRANT_RESEARCH_HTTP_PORT:-6335}:6333"
      - "${QDRANT_RESEARCH_GRPC_PORT:-6336}:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    volumes:
      - ./data/qdrant_research_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "diun.enable=true"
      - "diun.watch_repo=true"
