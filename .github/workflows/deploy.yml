name: Wiki PKN CI/CD (Linter & Quartz Build)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Job 1: Fail-fast Gatekeeper - Corpus Quality & Linter Audit
  # ============================================================================
  corpus-lint:
    name: Corpus Quality & Linter Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Wiki PKN Corpus Linter (fail-fast gatekeeper)
        run: python3 scripts/wiki_corpus_linter.py

  # ============================================================================
  # Job 2: Static Site Compilation, GHCR Image Build & Deployment
  # ============================================================================
  quartz-build:
    name: Quartz v5 Static Site & Docker Image Build
    needs: corpus-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Quartz plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: node scripts/patch_link_resolver.js

      - name: Clean public dir
        run: rm -rf public

      - name: Build Quartz
        run: npx quartz build

      - name: Record build commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf '%s\n' "$GITHUB_SHA" > public/build-version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quartz-build-output
          path: public/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Nginx Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL is required for main deployment" >&2
            exit 1
          fi
          curl --fail --show-error --silent --max-time 30 --request POST "$PORTAINER_WEBHOOK_URL"

      - name: Verify deployed commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for attempt in $(seq 1 30); do
            deployed=$(curl --fail --show-error --silent --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://wikipkn.insanmustaqbal.or.id/build-version.txt?commit=$GITHUB_SHA" || true)
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Deployed commit verified: $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not serve the expected commit" >&2
          exit 1
