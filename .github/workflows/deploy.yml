name: Wiki PKN CI/CD (Linter & Quartz Build)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Job 1: Fail-fast Gatekeeper - Corpus Quality & Linter Audit
  # ============================================================================
  corpus-lint:
    name: Corpus Quality & Linter Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Wiki PKN Corpus Linter (fail-fast gatekeeper)
        run: python3 scripts/wiki_corpus_linter.py

  # ============================================================================
  # Job 2: Static Site Compilation, GHCR Image Build & Deployment
  # ============================================================================
  quartz-build:
    name: Quartz v5 Static Site & Docker Image Build
    needs: corpus-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Quartz plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: node scripts/patch_link_resolver.js

      - name: Clean public dir
        run: rm -rf public

      - name: Build Quartz
        run: npx quartz build

      - name: Record build commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf '%s\n' "$GITHUB_SHA" > public/build-version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quartz-build-output
          path: public/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Nginx Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL is required for main deployment" >&2
            exit 1
          fi
          curl --fail --show-error --silent --max-time 30 --request POST "$PORTAINER_WEBHOOK_URL"

      - name: Verify deployed commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for attempt in $(seq 1 30); do
            deployed=$(curl --fail --show-error --silent --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://wikipkn.insanmustaqbal.or.id/build-version.txt?commit=$GITHUB_SHA" || true)
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Deployed commit verified: $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not serve the expected commit" >&2
          exit 1
