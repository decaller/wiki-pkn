name: Wiki PKN CI/CD (Linter & Quartz Build)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Job 1: Fail-fast Gatekeeper - Corpus Quality & Linter Audit
  # ============================================================================
  corpus-lint:
    name: Corpus Quality & Linter Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Wiki PKN Corpus Linter (fail-fast gatekeeper)
        run: python3 scripts/wiki_corpus_linter.py

  # ============================================================================
  # Job 2: Static Site Compilation, GHCR Image Build & Deployment
  # ============================================================================
  quartz-build:
    name: Quartz v5 Static Site & Docker Image Build
    needs: corpus-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Install dependencies
        run: npm ci || npm install

      - name: Apply patch
        run: node scripts/patch_link_resolver.js

      - name: Clean public dir
        run: rm -rf public

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartz-build-output
          path: public/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Nginx Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Optional Portainer Webhook
        continue-on-error: true
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "Triggering Portainer redeploy webhook..."
            curl -f -s -S -X POST -k "$PORTAINER_WEBHOOK_URL"
          else
            echo "PORTAINER_WEBHOOK_URL secret not present. Skipping."
          fi
