version: '3.8'

services:
  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_pkn_secret2026
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami_pkn_secret2026@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: c8e9b3a1d7f6e5a4b3c2d1e0f9a8b7c6d5e4f3a2b1
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - umami-net

volumes:
  umami-db-data:
    driver: local

networks:
  umami-net:
    driver: bridge
